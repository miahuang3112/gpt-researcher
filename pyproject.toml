[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-paper-evaluation-agent"
version = "1.0.0"
description = "Evidence-grounded computer-science paper evaluation agent with Web, REST, MCP and Skill interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "miahuang3112" }]
dependencies = [
  "asyncmy>=0.2.14,<1",
  "alembic>=1.19,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "langchain-text-splitters>=1.1,<2",
  "numpy>=2,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pymupdf>=1.28,<2",
  "python-multipart>=0.0.20,<1",
  "rank-bm25>=0.2.2,<1",
  "redis>=7,<9",
  "SQLAlchemy>=2,<3",
  "tiktoken>=0.13,<1",
  "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["backend*", "gpt_researcher*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/academic"]
python_files = "test_*.py"
